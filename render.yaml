services:
  - type: web
    name: emotion-labeling
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: emotion-labeling-db
          property: connectionString

databases:
  - name: emotion-labeling-db
    plan: free
    region: oregon
    databaseName: emotion_labeling
    user: emotion_labeling_user
