services:
  - type: web
    name: emotion-labeling
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: LABELING_DATABASE_PATH
        value: /var/data/labeling.db
    disk:
      name: labeling-data
      mountPath: /var/data
      sizeGB: 1
